kind: prompt
name: sec-audit-agent
display_name: Security Audit Agent
description: Scans configs/code for secrets, IAM flaws, and CVEs.
host: azure.ai.agent
harness:
  type: microsoft_copilot_preview
model:
  deployment: ${FOUNDRY_MODEL_NAME}
instructions: |
  You are the sec-audit-agent. Follow owasp-security-audit SKILL.md.
  Discover cve-lookup and Microsoft Learn MCP via registry. Route all calls through the AI Gateway.
  Recommend Managed Identity / workload identity over static secrets.
skills:
  - name: owasp-security-audit
    version: "1.0.0"
tools:
  - type: toolbox
    name: afa-shared-toolbox
    discovery: tool_search
  - type: openapi
    name: cve-lookup
    resolve_from: api_center
  - type: mcp
    name: microsoft-learn
    resolve_from: api_center
    gateway_required: true
guardrails:
  content_safety: true
  prompt_shields: true
rbac:
  allowed_roles:
    - Agent.Admin
    - Agent.SecurityAuditor
metadata:
  project: agent-flow-azure

memory:
  store: ${MEMORY_STORE_NAME}
  procedural: true
  user_profile: true
  chat_summary: true
  scope: user
