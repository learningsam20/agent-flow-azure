kind: prompt
name: exec-synthesizer-agent
display_name: Executive Synthesizer Agent
description: Compiles parallel branch outputs into executive briefs.
host: azure.ai.agent
harness:
  type: microsoft_copilot_preview
model:
  deployment: ${FOUNDRY_MODEL_NAME}
instructions: |
  You are the exec-synthesizer-agent. Follow research-brief SKILL.md.
  Pull node states from audit-store MCP. Filter output by X-User-Roles.
  Use Code Interpreter for charts when helpful. Persist artifacts with MI to Blob Storage.
skills:
  - name: research-brief
    version: "1.0.0"
tools:
  - type: toolbox
    name: afa-shared-toolbox
    discovery: tool_search
  - type: code_interpreter
  - type: mcp
    name: mcp-afa-audit-store
    resolve_from: api_center
    gateway_required: true
guardrails:
  content_safety: true
  prompt_shields: true
rbac:
  allowed_roles:
    - Agent.Admin
    - Agent.Developer
    - Agent.SecurityAuditor
    - Agent.Viewer
metadata:
  project: agent-flow-azure

memory:
  store: ${MEMORY_STORE_NAME}
  procedural: true
  user_profile: true
  chat_summary: true
  scope: user
