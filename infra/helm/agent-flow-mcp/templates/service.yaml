apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-flow-mcp.fullname" . }}
  labels:
    {{- include "agent-flow-mcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "agent-flow-mcp.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
