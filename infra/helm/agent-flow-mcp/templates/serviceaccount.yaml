{{- if .Values.workloadIdentity.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workloadIdentity.serviceAccount.name }}
  labels:
    {{- include "agent-flow-mcp.labels" . | nindent 4 }}
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: {{ .Values.identity.clientId | default .Values.workloadIdentity.clientId | quote }}
    {{- with .Values.workloadIdentity.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
